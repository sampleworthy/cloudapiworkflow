# Platform deployment: applies the shared platform after a merge to main.
# Runs rarely. dev applies automatically inside the "development" environment;
# prod requires the "production" environment's reviewers and PROD_ENABLED.
name: platform-deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/platform/**"
      - "terraform/modules/apim/**"
      - "terraform/modules/networking/**"
      - "terraform/modules/key-vault/**"
      - "terraform/modules/monitoring/**"
      - ".github/workflows/terraform-platform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    name: dev
    uses: ./.github/workflows/_terraform.yml
    permissions:
      contents: read
      id-token: write
    with:
      working_directory: terraform/platform/dev
      environment: development
      client_id: ${{ vars.AZURE_PLATFORM_CLIENT_ID_DEV }}
      subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
      tenant_id: ${{ vars.AZURE_TENANT_ID }}
      apply: true

  deploy-prod:
    name: prod
    needs: deploy-dev
    if: vars.PROD_ENABLED == 'true'
    uses: ./.github/workflows/_terraform.yml
    permissions:
      contents: read
      id-token: write
    with:
      working_directory: terraform/platform/prod
      environment: production
      client_id: ${{ vars.AZURE_PLATFORM_CLIENT_ID_PROD }}
      subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}
      tenant_id: ${{ vars.AZURE_TENANT_ID }}
      apply: true
