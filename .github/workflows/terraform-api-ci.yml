# API onboarding CI: runs on pull requests that add or change an API.
# Validates the API definition (schema, OpenAPI, policy), then plans against
# the EXISTING APIM instance and fails if the plan would touch the gateway.
name: api-ci

# Runs on EVERY pull request (no path filter) so it can be a required status
# check: a required check that never reports would block docs-only PRs.
# Platform CI is path-filtered instead and is not a required check.
on:
  pull_request:
    branches: [main]

concurrency:
  group: api-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: api definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml jsonschema

      - name: api.yaml schema + folder consistency + policy XML
        run: scripts/onboarding-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: OpenAPI lint (Spectral, .spectral.yaml)
        run: scripts/validate-openapi.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff terraform
      - name: terraform validate (onboarding roots, no backend)
        run: |
          for d in terraform/api-onboarding/dev terraform/api-onboarding/prod; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate -no-color
          done
      - name: environment roots in sync
        run: |
          for f in main.tf locals.tf variables.tf providers.tf outputs.tf; do
            diff -u "terraform/api-onboarding/dev/$f" "terraform/api-onboarding/prod/$f" || { echo "::error::terraform/api-onboarding/{dev,prod}/$f differ"; exit 1; }
          done

      - name: onboarding layer must not define the gateway
        run: |
          if grep -rEn 'resource\s+"azurerm_api_management"\s' terraform/api-onboarding terraform/modules/apim-api; then
            echo "::error::azurerm_api_management may only exist in the platform layer"; exit 1
          fi
          echo "ok: no APIM instance defined outside terraform/modules/apim"

  plan-dev:
    name: plan dev
    needs: validate
    uses: ./.github/workflows/_terraform.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      working_directory: terraform/api-onboarding/dev
      environment: development
      client_id: ${{ vars.AZURE_API_CLIENT_ID_DEV }}
      subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
      tenant_id: ${{ vars.AZURE_TENANT_ID }}
      apply: false
      guard_shared_apim: true

  plan-prod:
    name: plan prod
    needs: validate
    if: vars.PROD_ENABLED == 'true'
    uses: ./.github/workflows/_terraform.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      working_directory: terraform/api-onboarding/prod
      environment: production
      client_id: ${{ vars.AZURE_API_CLIENT_ID_PROD }}
      subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}
      tenant_id: ${{ vars.AZURE_TENANT_ID }}
      apply: false
      guard_shared_apim: true
