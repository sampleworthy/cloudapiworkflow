# Scope for the APIOps extractor (drift detection and operator-driven sync).
# Listing artifacts explicitly keeps the extractor from pulling in objects the
# platform does not govern through Git (e.g. portal-created subscriptions).
# Add every API here when it is onboarded.
apis:
  - skills-api-v1
  - orders-api-v1
  - foundry-models-v1
namedValues:
  - tenant-id
  - environment
  - api-audience
  - model-deployment
  - appinsights-connection-string
loggers:
  - appinsights
diagnostics:
  - applicationinsights
products:
  - internal-apis
  - agent-apis
backends:
  - skills-api
  - orders-api
  - foundry-models
versionSets:
  - skills-api
  - orders-api
  - foundry-models
policyFragments:
  - ai-observability
