# Reusable Terraform workflow.
#   apply=false -> "plan" job: no GitHub environment, OIDC subject pull_request; posts the plan on the PR.
#   apply=true  -> "deploy" job inside the named GitHub environment (approval gates live there; the
#                  environment name is the only OIDC subject Entra accepts for that deployer identity).
#                  After apply, the root's github_variables output is published as repository
#                  variables <KEY>_<ENV> so APIOps and test jobs never read Terraform state.
# Callers must grant the union of both jobs' permissions (GitHub validates every job,
# including the one that is skipped).
name: _terraform

on:
  workflow_call:
    inputs:
      working_directory: { type: string, required: true }
      environment:       { type: string, default: development }
      env_suffix:        { type: string, default: DEV }
      client_id:         { type: string, required: true }
      subscription_id:   { type: string, required: true }
      tenant_id:         { type: string, required: true }
      apply:             { type: boolean, default: false }

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ inputs.client_id }}
  ARM_TENANT_ID: ${{ inputs.tenant_id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
  TF_VAR_subscription_id: ${{ inputs.subscription_id }}

jobs:
  plan:
    if: ${{ !inputs.apply }}
    name: plan (${{ inputs.working_directory }})
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - id: tf
        uses: ./.github/actions/terraform
        with: { working_directory: "${{ inputs.working_directory }}", apply: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          path: |
            ${{ inputs.working_directory }}/plan.txt
            ${{ inputs.working_directory }}/plan.json
          retention-days: 14
      - name: comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env: { WORKDIR: "${{ inputs.working_directory }}", SUMMARY: "${{ steps.tf.outputs.summary }}" }
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKDIR, marker = `<!-- tf-plan:${dir} -->`;
            let plan = fs.readFileSync(`${dir}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, full plan in workflow artifact)';
            const body = `${marker}\n#### Terraform plan: \`${dir}\`\n**${process.env.SUMMARY}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>\n\n_Apply happens only after merge to \`main\`, from terraform-deploy._`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  deploy:
    if: ${{ inputs.apply }}
    name: apply (${{ inputs.working_directory }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: { group: "tf-${{ inputs.working_directory }}", cancel-in-progress: false }
    permissions: { contents: read, id-token: write, actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform
        with: { working_directory: "${{ inputs.working_directory }}", apply: "true" }
      # Best effort: the default job token cannot write repository variables
      # (403). Consumers read the outputs artifact below through
      # .github/actions/platform-context; variables are a fallback an operator
      # can refresh with `terraform output -json github_variables`.
      - name: publish platform outputs as repository variables (best effort)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}", SUFFIX: "${{ inputs.env_suffix }}" }
        working-directory: ${{ inputs.working_directory }}
        run: |
          jq -r '.github_variables.value | to_entries[] | "\(.key)=\(.value)"' outputs.json | while IFS='=' read -r k v; do
            gh variable set "${k}_${SUFFIX}" --repo "$GITHUB_REPOSITORY" --body "$v" && echo "set ${k}_${SUFFIX}"
          done
      - uses: actions/upload-artifact@v4
        with: { name: "outputs-${{ inputs.environment }}", path: "${{ inputs.working_directory }}/outputs.json", retention-days: 90 }
