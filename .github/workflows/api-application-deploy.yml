# Backend application deployment. Tests and zip-deploys every application in
# applications/<api>/ to its web app (found by the "api" tag Terraform sets),
# then waits for the API to answer through the gateway.
#
# Runs standalone on code changes, and is also called by api-deploy after
# Terraform has created or changed web apps.
name: application-deploy

on:
  push:
    branches: [main]
    paths:
      - "applications/**"
      - ".github/workflows/api-application-deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        type: string
        default: development
      client_id:
        type: string
        required: true
      subscription_id:
        type: string
        required: true
      tenant_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "apps=$(ls -d applications/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    env:
      RESOURCE_GROUP: rg-cloudapiworkflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: unit tests
        working-directory: applications/${{ matrix.app }}
        run: |
          pip install --quiet -r requirements-dev.txt
          pytest -q

      - uses: azure/login@v2
        with:
          client-id: ${{ inputs.client_id || vars.AZURE_API_CLIENT_ID_DEV }}
          tenant-id: ${{ inputs.tenant_id || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id || vars.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: find target web app (tag api=${{ matrix.app }})
        id: target
        run: |
          name=$(az webapp list -g "$RESOURCE_GROUP" --query "[?tags.api=='${{ matrix.app }}'].name | [0]" -o tsv)
          if [ -z "$name" ]; then
            echo "::notice::${{ matrix.app }} has no web app in this environment (not onboarded or backend not platform-hosted); skipping"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: package
        if: steps.target.outputs.name != ''
        working-directory: applications/${{ matrix.app }}
        run: zip -qr ../../app.zip app requirements.txt

      - name: zip deploy (Oryx build on App Service)
        if: steps.target.outputs.name != ''
        run: az webapp deploy -g "$RESOURCE_GROUP" -n "${{ steps.target.outputs.name }}" --src-path app.zip --type zip --clean true --restart true -o none

      - name: wait for health through the gateway
        if: steps.target.outputs.name != ''
        run: |
          pip install --quiet pyyaml
          gateway=$(az apim list -g "$RESOURCE_GROUP" --query "[0].gatewayUrl" -o tsv)
          path=$(python3 -c "import yaml;c=yaml.safe_load(open('apis/${{ matrix.app }}/api.yaml'));print(f\"{c['path']}/{c.get('version','v1')}\")")
          url="$gateway/$path/health"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::${{ matrix.app }} did not become healthy through the gateway"; exit 1
