name: terraform-run
description: >
  init / validate / plan (and optionally apply) one Terraform root with GitHub
  OIDC. Shared by every Terraform workflow so plan and apply behave identically.
  Authentication comes from ARM_* environment variables set by the caller.

inputs:
  working_directory:
    description: Terraform root, e.g. terraform/environments/dev
    required: true
  terraform_version:
    default: "1.16.2"
  apply:
    description: "true to apply the plan produced in this run"
    default: "false"
  guard_critical:
    description: "true to fail when the plan deletes or replaces APIM, the VNet, Key Vault or state storage (override with ALLOW_DESTRUCTIVE=true)"
    default: "true"
  detailed_exitcode:
    description: "true to expose has_changes without failing (drift detection)"
    default: "false"

outputs:
  summary:
    value: ${{ steps.plan.outputs.summary }}
  has_changes:
    value: ${{ steps.plan.outputs.has_changes }}

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform init -input=false -no-color -lockfile=readonly

    - name: terraform validate
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform validate -no-color

    - name: terraform plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -o pipefail
        terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan 2>&1 | tee plan.log
        terraform show -no-color tfplan > plan.txt
        terraform show -json tfplan > plan.json
        summary=$(grep -E '^(Plan:|No changes\.)' plan.log | tail -1 || echo "Plan: see log")
        echo "summary=$summary" >> "$GITHUB_OUTPUT"
        if grep -q '^No changes\.' plan.log; then echo "has_changes=false" >> "$GITHUB_OUTPUT"; else echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi
        { echo "### \`${{ inputs.working_directory }}\`"; echo; echo "**$summary**"; echo
          echo '<details><summary>plan</summary>'; echo; echo '```hcl'; head -c 60000 plan.txt; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

    - name: guard - critical platform resources must not be destroyed or replaced
      if: inputs.guard_critical == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        critical='["azurerm_api_management","azurerm_virtual_network","azurerm_key_vault","azurerm_storage_account","azurerm_resource_group"]'
        hits=$(jq -r --argjson c "$critical" '[.resource_changes[]? | select(.type as $t | $c | index($t)) | select(.change.actions | index("delete")) | "\(.address) \(.change.actions | join(","))"] | .[]' plan.json)
        if [ -n "$hits" ] && [ "${ALLOW_DESTRUCTIVE:-false}" != "true" ]; then
          echo "::error::Plan would destroy or replace a critical platform resource. Set ALLOW_DESTRUCTIVE=true on an approved, deliberate migration run to proceed."
          echo "$hits"; exit 1
        fi
        destroys=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
        echo "critical resources safe; resources to destroy in this plan: $destroys"
        [ "$destroys" != "0" ] && echo "::warning::plan destroys $destroys resource(s); review carefully" || true

    - name: terraform apply
      if: inputs.apply == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        terraform apply -input=false -no-color -lock-timeout=5m tfplan
        terraform output -json > outputs.json
        echo "applied: ${{ steps.plan.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
